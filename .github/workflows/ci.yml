name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1、Node.js 24対応
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0、Node.js 24対応
        with:
          enable-cache: true
          prune-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0、Node.js 24対応
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clean install for Mock runtime
        run: uv sync --frozen --extra dev
      - name: Confirm Claude SDK is not a Mock dependency
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('claude_agent_sdk') is None"
      - name: Import package
        run: uv run --no-sync python -c "import ai_dev_platform"
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Unit tests and coverage
        run: uv run --no-sync pytest
      - name: Secret scan of Git history and tracked files
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0、Node.js 24対応
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency vulnerabilities
        run: uv run --with pip-audit pip-audit
      - name: Dependency licenses
        run: uv run --no-sync pip-licenses --format=markdown
      - name: Build matrix source ZIP
        run: uv run --no-sync ai-dev package-source --output .ai-dev/local/ci-source.zip
      - name: Verify matrix source ZIP
        run: uv run --no-sync ai-dev verify-source-package --archive .ai-dev/local/ci-source.zip
      - name: Build formal review source ZIP
        if: matrix.python-version == '3.12'
        run: uv run --no-sync ai-dev package-source --output ai-development-platform-source.zip
      - name: Verify formal review source ZIP
        if: matrix.python-version == '3.12'
        run: uv run --no-sync ai-dev verify-source-package --archive ai-development-platform-source.zip
      - name: Upload formal review source ZIP
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1、Node.js 24対応
        with:
          name: ai-development-platform-source
          path: ai-development-platform-source.zip
          if-no-files-found: error
      - name: Clean install with Claude extra
        run: uv sync --frozen --extra dev --extra claude
      - name: Import Claude SDK
        run: uv run --no-sync python -c "import claude_agent_sdk"
