name: AI開発オーケストレーター
run-name: "AI開発 Issue #${{ inputs.issue }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 承認済みGitHub Issue番号
        required: true
        type: string

permissions:
  contents: write
  checks: read
  issues: read
  pull-requests: write

concurrency:
  group: ai-development-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  develop:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存関係を導入
        run: uv sync --frozen --extra dev --extra claude
      - name: 設定を検証
        run: uv run ai-dev validate
      - name: 承認済みIssueを事前検証
        env:
          GH_TOKEN: ${{ github.token }}
          AI_DEV_GITHUB_GATEWAY: gh
        run: uv run ai-dev issue-preflight --issue "${{ inputs.issue }}"
      - name: Claude開発を実行
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DEV_PROVIDER: claude
          AI_DEV_GITHUB_GATEWAY: gh
        run: uv run ai-dev run --issue "${{ inputs.issue }}" --commit-sha "${{ github.sha }}"
