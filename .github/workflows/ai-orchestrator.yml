name: AI orchestrator

on:
  workflow_dispatch:
    inputs:
      issue:
        description: GitHub Issue number
        required: true
        type: string
      provider:
        description: Agent provider
        required: true
        default: mock
        type: choice
        options: [mock, claude]
      github_gateway:
        description: GitHub gateway
        required: true
        default: mock
        type: choice
        options: [mock, gh]

permissions:
  contents: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  orchestrate:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra claude
      - run: uv run ai-dev validate
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run --with pip-audit pip-audit
      - uses: gitleaks/gitleaks-action@v2
      - name: Reject unsafe real-provider configuration
        if: inputs.provider == 'claude'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$ANTHROPIC_API_KEY"
      - name: Run governed workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DEV_PROVIDER: ${{ inputs.provider }}
          AI_DEV_GITHUB_GATEWAY: ${{ inputs.github_gateway }}
          AI_DEV_TRUSTED_EVENT: "true"
          AI_DEV_PRIVATE_REPOSITORY: "true"
          AI_DEV_FORK_PR: "false"
          AI_DEV_MINIMAL_PERMISSIONS: "true"
          AI_DEV_PRODUCTION_SECRETS_PRESENT: "false"
          AI_DEV_ALLOWED_BRANCHES: "ai/*"
          GITHUB_REF_NAME: ai/issue-${{ inputs.issue }}-ai-development
        run: uv run ai-dev run --issue "${{ inputs.issue }}" --commit-sha "${{ github.sha }}" --tests-passed --static-analysis-passed --secret-scan-passed --dependency-scan-passed
