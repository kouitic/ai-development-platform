schema_version: "1.0"
start: NEW
deterministic_nodes: [AUTOMATED_TESTING]
nodes:
  - NEW
  - REQUIREMENTS_ANALYSIS
  - DEPLOYMENT_CONFIGURATION
  - DEPLOYMENT_CONFIGURATION_REQUIRED
  - PLANNING
  - DESIGNING
  - IMPLEMENTING
  - AUTOMATED_TESTING
  - SYSTEM_REVIEW
  - BUSINESS_REVIEW
  - QA_ASSESSMENT
  - QA_CONDITIONAL_APPROVAL_REQUIRED
  - REWORK_REQUIRED
  - HUMAN_APPROVAL_REQUIRED
  - PAUSED
  - BLOCKED
  - COMPLETED
  - FAILED
  - SECURITY_INCIDENT_REQUIRES_HUMAN
  - DATA_EXPOSURE_REQUIRES_HUMAN
transitions:
  NEW: [REQUIREMENTS_ANALYSIS]
  REQUIREMENTS_ANALYSIS: [DEPLOYMENT_CONFIGURATION, FAILED]
  DEPLOYMENT_CONFIGURATION: [DEPLOYMENT_CONFIGURATION_REQUIRED, PLANNING, FAILED]
  DEPLOYMENT_CONFIGURATION_REQUIRED: [DEPLOYMENT_CONFIGURATION]
  PLANNING: [DESIGNING, FAILED]
  DESIGNING: [IMPLEMENTING, FAILED]
  IMPLEMENTING: [AUTOMATED_TESTING, FAILED]
  AUTOMATED_TESTING: [SYSTEM_REVIEW, REWORK_REQUIRED, FAILED]
  SYSTEM_REVIEW: [BUSINESS_REVIEW, REWORK_REQUIRED, FAILED]
  BUSINESS_REVIEW: [QA_ASSESSMENT, REWORK_REQUIRED, FAILED]
  QA_ASSESSMENT: [HUMAN_APPROVAL_REQUIRED, QA_CONDITIONAL_APPROVAL_REQUIRED, REWORK_REQUIRED, BLOCKED, FAILED]
  QA_CONDITIONAL_APPROVAL_REQUIRED: [HUMAN_APPROVAL_REQUIRED, REWORK_REQUIRED]
  REWORK_REQUIRED: [IMPLEMENTING, BLOCKED]
  HUMAN_APPROVAL_REQUIRED: [COMPLETED, REWORK_REQUIRED]
  PAUSED: [REQUIREMENTS_ANALYSIS, DEPLOYMENT_CONFIGURATION, PLANNING, DESIGNING, IMPLEMENTING, AUTOMATED_TESTING, SYSTEM_REVIEW, BUSINESS_REVIEW, QA_ASSESSMENT, REWORK_REQUIRED]
  BLOCKED: []
  COMPLETED: []
  FAILED: []
  SECURITY_INCIDENT_REQUIRES_HUMAN: []
  DATA_EXPOSURE_REQUIRES_HUMAN: []
rework:
  max_iterations: 3
  return_to: IMPLEMENTING
approval_gates:
  - DEPLOYMENT_CONFIGURATION_REQUIRED
  - QA_CONDITIONAL_APPROVAL_REQUIRED
  - HUMAN_APPROVAL_REQUIRED
incident_states:
  secret: SECURITY_INCIDENT_REQUIRES_HUMAN
  data_exposure: DATA_EXPOSURE_REQUIRES_HUMAN
