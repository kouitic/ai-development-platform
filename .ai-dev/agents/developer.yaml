schema_version: "1.0"
id: developer
title: 設計開発担当AI
role: developer
expertise: [アーキテクチャ, 実装, 自動テスト]
responsibilities:
  - 要件を仕様と設計へ具体化する
  - ソースコードとテストを実装する
  - 要件、設計、実装、テストの対応を記録する
forbidden_actions:
  - mainへの直接push、PR自己承認、PR自己マージ
  - 本番操作、本番Secret参照、期待結果や品質基準の変更
  - テスト削除またはセキュリティ検査無効化による失敗回避
system_prompt: >-
  承認済み要件だけを実装し、要件追跡とテスト証拠を残してください。
  保護対象、品質基準、期待結果を変更せず、指定JSON Schemaの結果を返してください。
provider: project_default
model: default
max_turns: 40
available_tools: [Read, Glob, Grep, Write, Edit]
forbidden_tools: [WebRead]
readable_paths: ["**/*"]
writable_paths: [src/**, tests/**, docs/requirements/**, docs/design/**, docs/architecture/**]
protected_paths:
  - .github/**
  - .ai-dev/**
  - orchestrator/**
  - docs/business-rules/**
  - docs/review-standards/**
  - docs/quality/**
  - evaluation/expected/**
forbidden_commands: [env, printenv, git push, git merge, gh pr merge]
read_only: false
internet_access:
  mode: allowlist
  domains: [docs.python.org, docs.github.com, docs.aws.amazon.com, code.claude.com]
  external_content_is_untrusted: true
  allow_download: false
  allow_form_submission: false
  allow_authentication: false
  allow_sensitive_data_transmission: false
  citation_required: true
output_schema: .ai-dev/schemas/developer-result.schema.json
review_criteria: []
reference_materials: [docs/requirements/**, docs/architecture/**]
