name: AI開発オーケストレーター
run-name: "AI開発 Issue #${{ inputs.issue }}"
on:
  workflow_dispatch:
    inputs:
      issue: {description: 承認済みGitHub Issue番号, required: true, type: string}
permissions:
  contents: write
  checks: read
  issues: read
  pull-requests: write
concurrency:
  group: ai-development-${{ inputs.issue }}
  cancel-in-progress: false
jobs:
  develop:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1、Node.js 24対応
        with: {ref: "${{ github.event.repository.default_branch }}", fetch-depth: 0}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0、Node.js 24対応
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0、Node.js 24対応
        with: {python-version: "3.12"}
      - name: 依存関係を導入
        run: uv sync --frozen --extra dev --extra claude
      - name: 設定を検証
        run: uv run ai-dev validate
      - name: 承認済みIssueを事前検証
        env:
          GH_TOKEN: ${{ github.token }}
          AI_DEV_GITHUB_GATEWAY: gh
        run: uv run ai-dev issue-preflight --issue "${{ inputs.issue }}"
      - name: Claude開発を実行
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_DEV_PROVIDER: claude
          AI_DEV_GITHUB_GATEWAY: gh
        run: uv run ai-dev run --issue "${{ inputs.issue }}" --commit-sha "${{ github.sha }}"
